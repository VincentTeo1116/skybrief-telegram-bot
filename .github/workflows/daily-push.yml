# Sends ONE weather + air-quality report a day from GitHub's servers (free, no server needed).
# Limits: no on-demand replies, no per-user Settings screen (use the Variables below instead).
# Do NOT also run the always-on bot with its daily report ON, or you will get duplicates.
#
# Secrets   (Settings > Secrets and variables > Actions > Secrets):
#     TELEGRAM_BOT_TOKEN, TG_CHAT_ID, WAQI_TOKEN (optional)
# Variables (same page > Variables; all optional):
#     CITY_NAME, CITY_LAT, CITY_LON, CITY_COUNTRY, CITY_TZ   (default: Kuala Lumpur)
#     LANGUAGE (en|ms|zh)   HIDDEN_SECTIONS (e.g. "forecast,tips")
#
# Timing: GitHub cron is UTC and often starts 5-20 min late. The job is scheduled for 08:15 Malaysia
# time (00:15 UTC) and then WAITS until exactly 08:30 before sending. If GitHub is later than 08:30,
# it sends immediately. Change SEND_AT and the cron line together if you want another time.
name: Daily weather push

on:
  workflow_dispatch:          # manual "Run workflow" button; sends immediately (no waiting)
  schedule:
    - cron: "15 0 * * *"      # 00:15 UTC = 08:15 in Malaysia / Singapore

concurrency:
  group: daily-weather-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx tzdata
      - run: python -m bot.cron_push
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          CITY_NAME: ${{ vars.CITY_NAME }}
          CITY_LAT: ${{ vars.CITY_LAT }}
          CITY_LON: ${{ vars.CITY_LON }}
          CITY_COUNTRY: ${{ vars.CITY_COUNTRY }}
          CITY_TZ: ${{ vars.CITY_TZ }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          HIDDEN_SECTIONS: ${{ vars.HIDDEN_SECTIONS }}
          SEND_AT: "08:30"
          WAIT_FOR_SEND_TIME: ${{ github.event_name == 'schedule' }}
