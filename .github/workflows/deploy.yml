# Deploys SkyBrief to Cloudflare automatically whenever you push to the `main` branch
# (and on demand from the Actions tab: "Run workflow").
#
# Order: install -> type-check -> unit tests -> apply database migrations -> deploy.
# If any step fails, nothing is deployed and the live bot keeps running the previous version.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    token with: Account > Workers Scripts > Edit, Account > D1 > Edit
#   CLOUDFLARE_ACCOUNT_ID
# The bot's own secrets (TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, ADMIN_IDS, WAQI_TOKEN) stay in Cloudflare;
# deploying never touches them.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:        # documentation-only changes don't need a redeploy
      - "**.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # never interrupt a deploy that is already running

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler d1 migrations apply skybrief --remote
          command: deploy
